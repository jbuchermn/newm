[tool.poetry]
name = "newm"
version = "0.3"
description = "newm - Wayland compositor"
authors = ["Jonas Bucher <j.bucher.mn@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/jbuchermn/newm"
repository = "https://github.com/jbuchermn/newm"
packages = [
    { include = "newm" },
    { include = "newm_panel_basic" }
]
include = [
    "newm/resources/wallpaper.jpg",
    "newm/resources/newm.desktop"
]

[tool.poetry.scripts]
start-newm = "newm.__main__:start_newm"
newm-cmd = "newm.cmd:main"
newm-panel-basic = "newm_panel_basic.__main__:main"

[tool.poetry.dependencies]
python = "^3.8"
pycairo = "*"
psutil = "*"
python-pam = "*"
pyfiglet = "*"
dasbus = "*"
thefuzz = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=newm",
    "--cov=newm_panel_basic",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take a long time to run"
]

[tool.coverage.run]
source = ["newm", "newm_panel_basic"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenv/*",
    "*/setup.py",
    "*/conftest.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"